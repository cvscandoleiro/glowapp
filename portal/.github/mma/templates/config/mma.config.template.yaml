# M3A Team Project Configuration Template
# File: templates/config/mma.config.template.yaml
# Description: Full config template with ALL fields and placeholder comments
# Generated by: /m3a-init on {{INIT_DATE}}
# Language: {{DOC_LANG}}
# Schema: ../../core/mma.config.schema.json
# Author: Edimar Ferla de Almeida
# Organization: Minsait (Indra Company)

version: "1.0.0"

# ─── Project Identity ──────────────────────────────────────────────────────────
# Core project metadata. Used throughout all generated artifacts.
project:
  name: "{{PROJECT_NAME}}"                # Full project name (e.g., "DRACO FIBER")
  code: "{{PROJECT_CODE}}"                # Short acronym used in file prefixes (e.g., "DRACO")
  description: "{{PROJECT_DESCRIPTION}}"  # One-line description
  type: "{{PROJECT_TYPE}}"                # new | existing | legacy | assessment | docs
  version_current: "{{VERSION_CURRENT}}"  # AS-IS version (blank for new projects)
  version_target: "{{VERSION_TARGET}}"    # TO-BE target version
  repo_url: "{{REPO_URL}}"               # Remote repository URL
  organization: "{{ORG_NAME}}"           # Short org name (e.g., "Minsait")
  legal_entity: "{{ORG_LEGAL}}"          # Legal org name (e.g., "Minsait (Indra Company)")
  tagline: "{{BRANDING_TAGLINE}}"        # Brand tagline for HTML portal
  client: "{{CLIENT_NAME}}"              # Client / end customer (or "Internal")

# ─── Communication ─────────────────────────────────────────────────────────────
# Governs agent output language and verbosity.
communication:
  language: "{{DOC_LANG}}"              # en-US | es-ES | pt-BR
  output_format: "minimal"              # minimal | verbose

# ─── Documentation ─────────────────────────────────────────────────────────────
# Documentation generation preferences and portal settings.
docs:
  mode: "{{DOCS_MODE}}"                 # markdown | markdown+html | portal
  output_dir: "docs/"
  html_dir: "docs/html/"
  portal_title: "{{PORTAL_TITLE}}"      # HTML portal H1 heading
  portal_subtitle: "{{PORTAL_SUBTITLE}}" # HTML portal subtitle

# ─── Governance ────────────────────────────────────────────────────────────────
# Quality, compliance, and process governance gates.
governance:
  quality_gates: {{GOVERNANCE_QUALITY_GATES}}      # true | false — DoD checklists
  adr_required: {{GOVERNANCE_ADR_REQUIRED}}         # true | false — ADR for arch decisions
  risk_gates: {{GOVERNANCE_RISK_GATES}}             # true | false — go/no-go gates
  human_in_the_loop: true                           # INVIOLABLE — always true
  anti_duplicate_check: true                        # INVIOLABLE — always true
  sprint_tracking: {{GOVERNANCE_SPRINT_TRACKING}}   # true | false

# ─── Technology Stack ──────────────────────────────────────────────────────────
# AS-IS stack definition (for existing/legacy projects) or target stack (for new).
stack:
  runtime: "{{STACK_RUNTIME}}"                      # e.g., "Java 11 (Azul Zulu)"
  runtime_version: "{{STACK_RUNTIME_VERSION}}"      # e.g., "11.0.22"
  runtime_target: "{{STACK_RUNTIME_TARGET}}"        # For migration: target runtime
  os: "{{STACK_OS}}"                                # e.g., "CentOS 7"
  os_target: "{{STACK_OS_TARGET}}"                  # For migration: target OS
  db: "{{STACK_DB}}"                                # e.g., "PostgreSQL 12.2"
  db_target: "{{STACK_DB_TARGET}}"                  # For migration: target DB
  ci: "{{STACK_CI}}"                                # e.g., "GitHub Actions"
  deploy: "{{STACK_DEPLOY}}"                        # e.g., "Kubernetes 1.27"

# ─── Team ──────────────────────────────────────────────────────────────────────
# Team members for Layer 2 (executive) attribution. Replaces agent identity in
# formal deliverables. These names appear in HTML portals and executive reports.
team:
  eng_a: "{{TEAM_ENG_A}}"               # Primary engineer (Layer 2 attribution)
  eng_b: "{{TEAM_ENG_B}}"               # Secondary engineer
  eng_c: "{{TEAM_ENG_C}}"               # Tertiary engineer (optional)
  size: "{{TEAM_SIZE}}"                  # solo | small | medium | large

# ─── Paths ─────────────────────────────────────────────────────────────────────
# File system paths for all M3A Team artifacts within this project.
# These are defaults — change only if you have a non-standard project structure.
paths:
  knowledge_base: ".github/mma/knowledge/"
  agents: ".github/agents/"
  prompts: ".github/prompts/"
  backlog: ".github/mma/backlog/"
  epics: ".github/mma/backlog/epics/"
  stories: ".github/mma/backlog/stories/"
  sprint_status: ".github/mma/backlog/sprints/sprint-status.yaml"
  workflows: ".github/mma/workflows/"
  docs_output: "docs/"
  html_output: "docs/html/"
  decisions_log: ".github/mma/decisions/decisions-log.md"
  team_config: ".github/mma/knowledge/team-config.md"

# ─── Encoding ──────────────────────────────────────────────────────────────────────────────
encoding:
  line_ending: "lf"                   # lf | crlf | auto  (default: lf)
  charset: "utf-8"                    # utf-8 | utf-8-bom | iso-8859-1 (default: utf-8)
